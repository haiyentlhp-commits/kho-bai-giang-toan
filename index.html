
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kho học liệu Toán học</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1e293b;
    }
    header {
      background: #153c70;
      color: white;
      padding: 32px 18px;
      text-align: center;
    }
    header p { color: #dbeafe; }
    main {
      max-width: 950px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    input, select {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
      font-size: 16px;
    }
    input { flex: 1; min-width: 210px; }
    select { max-width: 100%; }
    h2 { color: #153c70; }
    .lesson {
      background: white;
      padding: 18px;
      margin: 12px 0;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .lesson h3 { margin-top: 0; }
    .tag { color: #52647a; font-size: 14px; }
    .lesson a {
      display: inline-block;
      margin-top: 8px;
      color: #1558a6;
      font-weight: bold;
    }
    #empty { display: none; padding: 20px 0; }
    footer {
      text-align: center;
      padding: 24px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kho học liệu Toán học</h1>
    <p>Bài giảng · Kiến thức · Luyện tập</p>
  </header>

  <main>
    <h2>Danh sách bài học</h2>

    <div class="filters">
      <input id="search"
        placeholder="Tìm tên bài, chương, từ khóa..."
        aria-label="Tìm kiếm bài học">

      <select id="grade" aria-label="Chọn lớp">
        <option value="">Tất cả các lớp</option>
        <option value="10">Toán 10</option>
        <option value="11">Toán 11</option>
        <option value="12">Toán 12</option>
      </select>
    </div>

    <section id="lessons"></section>
    <p id="empty">Chưa tìm thấy bài học phù hợp.</p>
  </main>

  <footer>Kho học liệu Toán học · Cùng học tốt mỗi ngày</footer>

  <script>
    // DỮ LIỆU MẪU: thay bằng bài giảng của bạn.
    const data = [
      {
        grade: "10",
        chapter: "Chương 1: Mệnh đề và tập hợp",
        title: "Mệnh đề toán học",
        keywords: "mệnh đề logic đúng sai",
        url: ""
      },
      {
        grade: "10",
        chapter: "Chương 2: Bất phương trình",
        title: "Bất phương trình bậc nhất hai ẩn",
        keywords: "miền nghiệm hệ bất phương trình",
        url: ""
      },
      {
        grade: "11",
        chapter: "Chương 1: Hàm số lượng giác",
        title: "Giá trị lượng giác của góc",
        keywords: "sin cos tan cot",
        url: ""
      },
      {
        grade: "11",
        chapter: "Chương 2: Dãy số",
        title: "Cấp số cộng",
        keywords: "công sai số hạng tổng quát",
        url: ""
      },
      {
        grade: "12",
        chapter: "Chương 1: Ứng dụng đạo hàm",
        title: "Tính đơn điệu của hàm số",
        keywords: "đồng biến nghịch biến",
        url: ""
      }
    ];

    const search = document.getElementById("search");
    const grade = document.getElementById("grade");
    const lessons = document.getElementById("lessons");
    const empty = document.getElementById("empty");

    function render() {
      const q = search.value.trim().toLocaleLowerCase("vi");
      const g = grade.value;

      const filtered = data.filter(item => {
        const text = (
          item.chapter + " " + item.title + " " +
          item.keywords + " Toán " + item.grade
        ).toLocaleLowerCase("vi");

        return (!g || item.grade === g) && text.includes(q);
      });

      lessons.innerHTML = filtered.map(item => `
        <article class="lesson">
          <div class="tag">
            Toán ${item.grade} · ${item.chapter}
          </div>
          <h3>${item.title}</h3>
          ${
            item.url
              ? `<a href="${item.url}"
                   target="_blank"
                   rel="noopener noreferrer">
                   Mở bài giảng ↗
                 </a>`
              : `<span class="tag">
                   Bài mẫu — chưa thêm tài liệu
                 </span>`
          }
        </article>
      `).join("");

      empty.style.display = filtered.length ? "none" : "block";
    }

    search.addEventListener("input", render);
    grade.addEventListener("change", render);
    render();
  </script>
</body>
</html>
